[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prodr-writer"
version = "2.0.0"
description = "Disaster Recovery proposal document generator (CrewAI multi-agent, OpenAI-compatible LLMs)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# Runtime dependencies live in requirements.txt (single source of truth,
# also consumed directly by install.sh); setuptools pulls the list in below.
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
prodr-writer = "prodr_writer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
prodr_writer = ["resources/*.yaml", "profiles/*.yaml", "web/static/*"]
