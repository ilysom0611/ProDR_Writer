[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prodr-writer"
version = "2.0.0"
description = "Disaster Recovery proposal document generator (CrewAI multi-agent, OpenAI-compatible LLMs)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "crewai>=1.12.0",
    "litellm>=1.65.0",
    "python-docx>=1.2.0",
    "pydantic>=2.0",
    "typer>=0.9.0",
    "rich>=10.11.0",
    "matplotlib>=3.5.0",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
prodr-writer = "prodr_writer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prodr_writer = ["resources/*.yaml", "profiles/*.yaml", "web/static/*"]
